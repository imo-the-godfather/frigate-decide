[project]
name = "frigate-decide"
version = "0.1.0"
description = "Frigate sidecar that gates alerts with a local Ollama decision model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RYKLIEF-ORG" }]
dependencies = [
    "paho-mqtt>=2.0,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
frigate-decide = "frigate_decide.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["frigate_decide*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
